# NOTE: images are expected locally as packetguard/<name>:latest (see k8s/deploy-minikube.sh)
# or pushed to your registry by the Jenkins pipeline (which rewrites them with `kubectl set image`).
apiVersion: v1
kind: Service
metadata: { name: ml-service, namespace: packetguard }
spec: { selector: { app: ml-service }, ports: [{ port: 8000 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ml-service, namespace: packetguard }
spec:
  replicas: 1
  selector: { matchLabels: { app: ml-service } }
  template:
    metadata: { labels: { app: ml-service } }
    spec:
      containers:
        - name: ml-service
          image: packetguard/ml-service:latest
          imagePullPolicy: IfNotPresent
          envFrom: [{ configMapRef: { name: packetguard-config } }]
          ports: [{ containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 20, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 60, periodSeconds: 20, failureThreshold: 5 }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "1", memory: 1500Mi } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: ml-service, namespace: packetguard }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ml-service }
  minReplicas: 1
  maxReplicas: 3
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
---
apiVersion: v1
kind: Service
metadata: { name: sniffer, namespace: packetguard }
spec: { selector: { app: sniffer }, ports: [{ port: 8001 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: sniffer, namespace: packetguard }
spec:
  replicas: 1
  selector: { matchLabels: { app: sniffer } }
  template:
    metadata: { labels: { app: sniffer } }
    spec:
      containers:
        - name: sniffer
          image: packetguard/sniffer:latest
          imagePullPolicy: IfNotPresent
          envFrom: [{ configMapRef: { name: packetguard-config } }]
          readinessProbe: { httpGet: { path: /health, port: 8001 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 8001 }, initialDelaySeconds: 30, periodSeconds: 20 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: sqlite-data, namespace: packetguard }
spec: { accessModes: ["ReadWriteOnce"], resources: { requests: { storage: 1Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: backend, namespace: packetguard }
spec: { selector: { app: backend }, ports: [{ port: 5000 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: backend, namespace: packetguard }
spec:
  replicas: 1   # SQLite is a single-writer file on a ReadWriteOnce volume -> keep 1 replica (see README: swap to Postgres to scale out)
  strategy: { type: Recreate }
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
        - name: backend
          image: packetguard/backend:latest
          imagePullPolicy: IfNotPresent
          envFrom: [{ configMapRef: { name: packetguard-config } }, { secretRef: { name: packetguard-secrets } }]
          ports: [{ containerPort: 5000 }]
          volumeMounts: [{ name: sqlite, mountPath: /data }]
          readinessProbe: { httpGet: { path: /health, port: 5000 }, initialDelaySeconds: 15, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 5000 }, initialDelaySeconds: 40, periodSeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { memory: 512Mi } }
      volumes: [{ name: sqlite, persistentVolumeClaim: { claimName: sqlite-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: packetguard }
spec:
  type: NodePort
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80, nodePort: 30080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: packetguard }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: packetguard/frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
          readinessProbe: { httpGet: { path: /health, port: 80 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 80 }, initialDelaySeconds: 10, periodSeconds: 20 }
          resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { memory: 128Mi } }
