# --- MongoDB single-node replica set (change streams need a replica set) ---
apiVersion: v1
kind: Service
metadata: { name: mongo, namespace: packetguard }
spec:
  clusterIP: None
  selector: { app: mongo }
  ports: [{ port: 27017 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mongo, namespace: packetguard }
spec:
  serviceName: mongo
  replicas: 1
  selector: { matchLabels: { app: mongo } }
  template:
    metadata: { labels: { app: mongo } }
    spec:
      containers:
        - name: mongo
          image: mongo:7
          args: ["--replSet", "rs0", "--bind_ip_all"]
          ports: [{ containerPort: 27017 }]
          volumeMounts: [{ name: data, mountPath: /data/db }]
          readinessProbe:
            exec: { command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: ["ReadWriteOnce"], resources: { requests: { storage: 2Gi } } }
---
apiVersion: batch/v1
kind: Job
metadata: { name: mongo-init, namespace: packetguard }
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mongo:7
          command: ["sh", "-c"]
          args:
            - >
              until mongosh --host mongo --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }" | grep -q 1; do echo waiting; sleep 3; done
---
# --- Redpanda (Kafka API) ---
apiVersion: v1
kind: Service
metadata: { name: redpanda, namespace: packetguard }
spec:
  selector: { app: redpanda }
  ports: [{ port: 9092 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redpanda, namespace: packetguard }
spec:
  replicas: 1
  selector: { matchLabels: { app: redpanda } }
  template:
    metadata: { labels: { app: redpanda } }
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v24.2.7
          args: ["redpanda", "start", "--mode=dev-container", "--smp=1", "--memory=768M", "--reserve-memory=0M", "--overprovisioned", "--node-id=0",
                 "--kafka-addr=internal://0.0.0.0:9092", "--advertise-kafka-addr=internal://redpanda:9092", "--set=redpanda.auto_create_topics_enabled=true"]
          ports: [{ containerPort: 9092 }]
          readinessProbe:
            exec: { command: ["sh", "-c", "rpk cluster health | grep -E 'Healthy:.+true'"] }
            initialDelaySeconds: 10
            periodSeconds: 8
          resources: { requests: { cpu: 200m, memory: 768Mi }, limits: { memory: 1500Mi } }
