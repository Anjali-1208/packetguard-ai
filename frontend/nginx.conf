server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /health { return 200 'ok'; add_header Content-Type text/plain; }
  location /api/ { proxy_pass http://backend:5000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location /socket.io/ { proxy_pass http://backend:5000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_read_timeout 86400; }
  location / { try_files $uri /index.html; }
}
